name: Despliegue a Hostinger FTP

on:
  push:
    branches:
      - main
      - master # Soporta tanto 'main' como 'master' según cuál sea tu rama principal

jobs:
  web-deploy:
    name: Compilar y Desplegar
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Obtener código del repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar entorno de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Actualizado a Node 22 para evitar avisos de depreciación

      - name: 📦 Instalar dependencias
        run: npm install --no-audit --no-fund --prefer-offline

      - name: 🔍 Diagnóstico de credenciales (Seguro)
        run: |
          echo "=== Diagnóstico de Variables en GitHub ==="
          if [ -z "${{ secrets.FTP_HOST || vars.FTP_HOST }}" ]; then
            echo "❌ ERROR: FTP_HOST no se detecta. Verifica que esté creado exactamente con ese nombre (en mayúsculas) en Repository Secrets."
          else
            echo "✅ FTP_HOST detectado correctamente."
          fi
          if [ -z "${{ secrets.FTP_USER || vars.FTP_USER }}" ]; then
            echo "❌ ERROR: FTP_USER no se detecta."
          else
            echo "✅ FTP_USER detectado correctamente."
          fi
          if [ -z "${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}" ]; then
            echo "❌ ERROR: FTP_PASSWORD no se detecta."
          else
            echo "✅ FTP_PASSWORD detectado correctamente."
          fi

      - name: 🏗️ Compilar el proyecto para producción
        run: npm run build

      - name: 📤 Subir archivos compilados vía FTP a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST || vars.FTP_HOST }}
          username: ${{ secrets.FTP_USER || vars.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /domains/unke.com.ar/public_html/palmar/
          port: 21
          security: loose # Permite la conexión ante certificados auto-firmados o sin dominio coincidente para evitar que se cuelgue la conexión

