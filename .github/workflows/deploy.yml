name: Despliegue a Hostinger FTP

on:
  push:
    branches:
      - main
      - master # Soporta tanto 'main' como 'master' según cuál sea tu rama principal
  workflow_dispatch: # Permite ejecutar el despliegue manualmente desde GitHub Actions con un botón

jobs:
  web-deploy:
    name: Compilar y Desplegar
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Obtener código del repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar entorno de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Instalar dependencias
        run: npm install --no-audit --no-fund --prefer-offline

      - name: 🔍 Diagnóstico de credenciales (Seguro)
        run: |
          echo "=== Diagnóstico de Variables en GitHub ==="
          if [ -z "${{ secrets.FTP_HOST || secrets.FTP_SERVER || vars.FTP_HOST || vars.FTP_SERVER }}" ]; then
            echo "ℹ️ FTP_HOST no se especificó en secrets. Se usará automáticamente 'ftp.unke.com.ar'."
          else
            echo "✅ Servidor FTP detectado."
          fi
          if [ -z "${{ secrets.FTP_USER || secrets.FTP_USERNAME || vars.FTP_USER || vars.FTP_USERNAME }}" ]; then
            echo "❌ ATENCIÓN: No se detecta FTP_USER ni FTP_USERNAME en los Repository Secrets de GitHub."
          else
            echo "✅ Usuario FTP detectado."
          fi
          if [ -z "${{ secrets.FTP_PASSWORD || secrets.FTP_PASS || vars.FTP_PASSWORD || vars.FTP_PASS }}" ]; then
            echo "❌ ATENCIÓN: No se detecta FTP_PASSWORD ni FTP_PASS en los Repository Secrets de GitHub."
          else
            echo "✅ Contraseña FTP detectada."
          fi

      - name: 🏗️ Compilar el proyecto para producción
        run: npm run build

      - name: 📤 Subir archivos compilados vía FTP a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST || secrets.FTP_SERVER || vars.FTP_HOST || vars.FTP_SERVER || 'ftp.unke.com.ar' }}
          username: ${{ secrets.FTP_USER || secrets.FTP_USERNAME || vars.FTP_USER || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || secrets.FTP_PASS || vars.FTP_PASSWORD || vars.FTP_PASS }}
          local-dir: ./dist/
          server-dir: /domains/unke.com.ar/public_html/palmar/
          port: 21
          security: loose # Permite la conexión ante certificados auto-firmados o sin dominio coincidente para evitar que se cuelgue la conexión

